      property="og:description"
      content="Production React websites and web apps, UI/UX design, video editing, motion graphics, 3D visuals, SEO, AI automation, and studio editions store."

      name="twitter:description"
      content="Production React websites and web apps, UI/UX design, video editing, motion graphics, 3D visuals, SEO, AI automation, and studio editions store."
    />
    <meta name="twitter:image" content="https://mushafkhan.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Redirect legacy #/route links to clean BrowserRouter paths while preserving #admin, #admin-tools, #review */
      (function () {
        var h = window.location.hash || '';
        if (h.indexOf('#/') === 0) {
          var nextPath = h.slice(1);
          if (nextPath) {
            window.history.replaceState(null, '', nextPath);
          }
        }
      })();
      /* Apply persisted theme before React mounts (default: light) */
      (function () {
        var saved = 'light';
        try {
          var stored = localStorage.getItem('mushaf_portfolio_theme');
          if (stored === 'dark' || stored === 'light') saved = stored;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', saved);
        root.classList.remove('light', 'dark');
        root.classList.add(saved);
        root.style.colorScheme = saved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', saved === 'dark' ? '#090B08' : '#FAF8F4');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
